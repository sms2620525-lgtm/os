name: Build Debian ISO (amd64 + arm64)

# Manual only. The arm64 job needs an ARM runner, which is free for public repositories only.
on:
  workflow_dispatch:

jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64            # Apple Silicon (UTM / Parallels / VMware Fusion), ARM PCs
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Install live-build
        run: apt-get update && apt-get install -y live-build git make python3 python3-pyqt6 python3-psutil ca-certificates curl
      - uses: actions/checkout@v4
      - name: Build
        run: cd distro && ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: fenestra-os-${{ matrix.arch }}-iso
          path: distro/*.iso
          compression-level: 0
