# Fenestra compositor settings: rounded corners, soft shadows, acrylic blur
backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 8;
rounded-corners-exclude = [
  "name = 'fenestra-taskbar'",
  "name = 'fenestra-desktop'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.28;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'fenestra-desktop'",
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'firefox' && argb"
];

# Acrylic/Mica-like background blur behind translucent shell surfaces
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.96; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
