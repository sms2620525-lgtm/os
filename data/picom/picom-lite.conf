# Fenestra compositor settings for machines without GPU acceleration
# (virtual machines, software rendering): XRender backend, no blur.
backend = "xrender";
vsync = false;
use-damage = true;
corner-radius = 8;
rounded-corners-exclude = [
  "name = 'fenestra-taskbar'",
  "name = 'fenestra-desktop'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.22;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [
  "name = 'fenestra-desktop'",
  "window_type = 'desktop'",
  "window_type = 'dock'"
];
blur-background = false;
fading = false;
